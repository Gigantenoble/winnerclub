<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WinnerClub</title>
  <script>
    (function(){
      const path = window.location.pathname.replace(/\/+$/, '');
      if(path.endsWith('/admin')){
        window.location.replace(window.location.origin + '/?login=admin');
      } else {
        window.location.replace(window.location.origin + '/');
      }
    })();
  </script>
</head>
<body></body>
</html>
